[project]
name = "submitkit"
version = "0.1.0"
description = "Small, project-agnostic SLURM/local job submission on top of submitit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "submitit>=1.5.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/submitkit"]
